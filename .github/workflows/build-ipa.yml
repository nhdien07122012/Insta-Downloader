name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build InstaPhotos IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd ios-photo-app
          npm install

      - name: Build Web Application
        run: |
          cd ios-photo-app
          npm run build

      - name: Sync with Capacitor iOS
        run: |
          cd ios-photo-app
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios-photo-app/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .ipa
        run: |
          cd ios-photo-app/ios/App
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/App.app Payload/App.app
          cp App/Assets.xcassets/AppIcon.appiconset/*.png Payload/App.app/ || true
          cp App/AppIcon*.png Payload/App.app/ || true
          cp App/iTunesArtwork*.png Payload/App.app/ || true
          zip -qr InstaPhotos.ipa Payload
          echo "=== IPA File Created ==="
          ls -lh InstaPhotos.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstaPhotos.ipa
          path: ios-photo-app/ios/App/InstaPhotos.ipa
          if-no-files-found: error

      - name: Publish Direct IPA Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "InstaPhotos Latest Build"
          body: |
            Bản dựng IPA mới nhất được tự động biên dịch và tạo từ GitHub Actions.
            
            📲 **Link tải trực tiếp cho iPhone (Safari / TrollStore / AltStore / Scarlet):**
            https://github.com/${{ github.repository }}/releases/latest/download/InstaPhotos.ipa
          draft: false
          prerelease: false
          make_latest: true
          files: ios-photo-app/ios/App/InstaPhotos.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
